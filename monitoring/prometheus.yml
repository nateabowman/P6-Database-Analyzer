# Prometheus configuration for P6 Database Analyzer

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'p6-analyzer'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'p6-analyzer-health'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/health/detailed'

