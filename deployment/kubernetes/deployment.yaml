apiVersion: apps/v1
kind: Deployment
metadata:
  name: p6-analyzer
  labels:
    app: p6-analyzer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: p6-analyzer
  template:
    metadata:
      labels:
        app: p6-analyzer
    spec:
      containers:
      - name: p6-analyzer
        image: p6-analyzer:latest
        ports:
        - containerPort: 8000
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_JSON
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

