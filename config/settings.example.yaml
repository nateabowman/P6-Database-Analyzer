# P6 Database Analyzer Configuration Example
# Copy this file to settings.yaml and modify as needed

# Logging configuration
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  json: false  # Use JSON format for logs (useful for log aggregation)
  log_dir: logs
  max_bytes: 10485760  # 10MB per log file
  backup_count: 5  # Number of backup log files to keep

# Database connection settings
database:
  connection_timeout: 30  # Connection timeout in seconds
  query_timeout: 300  # Query timeout in seconds
  retry_attempts: 3  # Number of retry attempts on failure
  retry_delay: 1  # Delay between retries in seconds
  tls_enabled: false  # Enable TLS/SSL for database connections
  tls_verify: true  # Verify TLS certificates

# Analysis settings
analysis:
  timeout: 3600  # Maximum analysis duration in seconds (1 hour)
  parallel: false  # Enable parallel execution of independent analyzers
  cache_enabled: true  # Enable result caching
  cache_ttl: 3600  # Cache time-to-live in seconds (1 hour)

# Security settings
security:
  credential_storage: keyring  # Storage type: 'keyring' or 'encrypted_file'
  tls_enabled: false  # Enable TLS/SSL
  tls_verify: true  # Verify TLS certificates

# Report settings
reports:
  default_format: html  # Default report format: 'html' or 'pdf'
  include_charts: true  # Include charts in reports
  include_recommendations: true  # Include remediation recommendations

